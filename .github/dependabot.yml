version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      test-dependencies:
        patterns:
          - "org.junit*"
          - "org.assertj:*"
          - "io.mockk:*"
          - "org.wiremock:*"
          - "org.testcontainers:*"

  # The examples are a standalone build, deliberately kept on the minimum Gradle
  # version the plugin supports so they double as a check that the floor still
  # works. Wrapper bumps are skipped here on purpose; the plugin classpath is a
  # snapshot of this very project and is bumped by the release process.
  - package-ecosystem: "gradle"
    directory: "/examples"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "gradle-wrapper"
      - dependency-name: "com.github.imflog:kafka-schema-registry-gradle-plugin"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
