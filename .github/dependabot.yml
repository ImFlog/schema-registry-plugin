version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # The Confluent repository exposes no release dates, so Dependabot's cooldown
    # filter drops every Confluent version ("Release date not available"), even
    # without a configured cooldown. Excluding it explicitly should let them through.
    cooldown:
      default-days: 1
      exclude:
        - "io.confluent:*"
    groups:
      test-dependencies:
        patterns:
          - "org.junit*"
          - "org.assertj:*"
          - "io.mockk:*"
          - "org.wiremock:*"
          - "org.testcontainers:*"

  # The examples are a standalone build that tracks the current Gradle version;
  # the minimum supported Gradle is checked by the integration tests instead
  # (see GradleVersions.MINIMUM). The plugin classpath is a snapshot of this very
  # project and is bumped by the release process, so it stays ignored here.
  - package-ecosystem: "gradle"
    directory: "/examples"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "com.github.imflog:kafka-schema-registry-gradle-plugin"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
