# Pinned to the minimum Gradle version the plugin supports (see ../README.md).
# The examples double as a check that this floor still works, so this is not
# kept in step with the root build. Dependabot skips it (.github/dependabot.yml).
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.6-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
