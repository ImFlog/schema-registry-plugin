# Kept in step with the root build's Gradle version.
# The 8.6 floor the plugin supports is covered by the integration tests
# (see GradleVersions.MINIMUM), not by this wrapper: the docker-compose
# plugin the examples use is compiled against Groovy 4, so it needs Gradle 9+.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.7.1-bin.zip
networkTimeout=10000
retries=0
retryBackOffMs=500
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
